<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rubik's Cube Web Timer — WCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- =========================================================
       PHẦN 1: CSS — BỐ CỤC GỌN 1 MÀN HÌNH, KỶ LỤC DƯỚI ĐỒNG HỒ & NÚT 3 CHẤM
       ========================================================= -->
  <style>
    :root {
      --bg-base: #0b1021;
      --bg-overlay: radial-gradient(circle at center, rgba(10, 14, 28, 0.22) 0%, rgba(6, 9, 20, 0.58) 100%);
      --panel-bg: rgba(255, 255, 255, 0.1);
      --panel-border: rgba(255, 255, 255, 0.22);
      --panel-blur: 15px;
      --panel-radius: 14px;
      --subpanel-bg: rgba(0, 0, 0, 0.24);
      --subpanel-border: rgba(255, 255, 255, 0.14);
      --btn-bg: rgba(255, 255, 255, 0.12);
      --btn-bg-hover: rgba(255, 255, 255, 0.22);
      --btn-border: rgba(255, 255, 255, 0.26);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.84);
      --text-muted: rgba(255, 255, 255, 0.64);
      --accent-stat: #7dd3fc;
      --state-idle: #ffffff;
      --state-holding: #ff4d6d;
      --state-ready: #2ee59d;
      --state-running: #f8fafc;
      --shadow-panel: 0 14px 36px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      --shadow-text: 0 2px 10px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.65);
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace;
    }

    /* Giao diện 2: Tối giản (Dark Minimal) */
    body[data-theme="dark"] {
      --bg-base: #0f1117;
      --bg-overlay: rgba(9, 11, 16, 0.62);
      --panel-bg: rgba(24, 27, 36, 0.9);
      --panel-border: rgba(255, 255, 255, 0.1);
      --panel-blur: 10px;
      --panel-radius: 12px;
      --subpanel-bg: rgba(15, 17, 23, 0.72);
      --subpanel-border: rgba(255, 255, 255, 0.08);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-bg-hover: rgba(255, 255, 255, 0.16);
      --btn-border: rgba(255, 255, 255, 0.15);
      --accent-stat: #38bdf8;
      --shadow-panel: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    /* Giao diện 3: Sáng (Light Clean) */
    body[data-theme="light"] {
      --bg-base: #eef2f7;
      --bg-overlay: rgba(241, 245, 249, 0.58);
      --panel-bg: rgba(255, 255, 255, 0.88);
      --panel-border: rgba(15, 23, 42, 0.12);
      --panel-blur: 12px;
      --panel-radius: 12px;
      --subpanel-bg: rgba(241, 245, 249, 0.92);
      --subpanel-border: rgba(15, 23, 42, 0.1);
      --btn-bg: rgba(15, 23, 42, 0.06);
      --btn-bg-hover: rgba(15, 23, 42, 0.12);
      --btn-border: rgba(15, 23, 42, 0.16);
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent-stat: #0284c7;
      --state-idle: #0f172a;
      --state-holding: #e11d48;
      --state-ready: #059669;
      --state-running: #0f172a;
      --shadow-panel: 0 10px 28px rgba(15, 23, 42, 0.08);
      --shadow-text: none;
    }

    /* Giao diện 4: Cổ điển (WCA Classic / Bảng phấn) */
    body[data-theme="classic"] {
      --bg-base: #162a24;
      --bg-overlay: rgba(12, 24, 20, 0.58);
      --panel-bg: rgba(26, 56, 46, 0.92);
      --panel-border: rgba(180, 130, 80, 0.65);
      --panel-blur: 6px;
      --panel-radius: 10px;
      --subpanel-bg: rgba(18, 40, 33, 0.88);
      --subpanel-border: rgba(255, 255, 255, 0.14);
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-bg-hover: rgba(255, 255, 255, 0.2);
      --btn-border: rgba(255, 255, 255, 0.24);
      --text-primary: #f9fafb;
      --text-secondary: #e5e7eb;
      --text-muted: #9ca3af;
      --accent-stat: #93c5fd;
      --state-idle: #f9fafb;
      --state-holding: #f87171;
      --state-ready: #34d399;
      --state-running: #fef08a;
      --shadow-panel: 0 8px 22px rgba(0, 0, 0, 0.45);
      --shadow-text: 0 2px 6px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      font-family: var(--font-sans);
      color: var(--text-primary);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      position: relative;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 18% 22%, rgba(99, 102, 241, 0.42) 0%, transparent 48%),
        radial-gradient(circle at 82% 18%, rgba(236, 72, 153, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 75% 82%, rgba(20, 184, 166, 0.38) 0%, transparent 50%),
        linear-gradient(135deg, #090d1a 0%, #141b33 50%, #0d1628 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      transition: background-color 0.25s ease, color 0.2s ease;
    }

    body[data-theme="dark"] {
      background-image: linear-gradient(160deg, #0f1117 0%, #161b26 100%);
    }

    body[data-theme="light"] {
      background-image: linear-gradient(145deg, #e2e8f0 0%, #f8fafc 55%, #e0e7ff 100%);
    }

    body[data-theme="classic"] {
      background-image: linear-gradient(160deg, #1b352c 0%, #11221c 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      pointer-events: none;
      z-index: 0;
      transition: background 0.25s ease;
    }

    /* =========================================================
       BỐ CỤC CHÍNH GỌN TRONG 1 MÀN HÌNH (KHÔNG CẦN VUỐT XUỐNG)
       ========================================================= */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      height: 100dvh;
      margin: 0 auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    body.is-timing .top-bar,
    body.is-timing .scramble-panel,
    body.is-timing .bottom-dock {
      opacity: 0.18;
      filter: blur(2px);
      pointer-events: none;
    }

    .panel-box {
      position: relative;
      background: var(--panel-bg);
      backdrop-filter: blur(var(--panel-blur));
      -webkit-backdrop-filter: blur(var(--panel-blur));
      border: 1px solid var(--panel-border);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow-panel);
      transition: opacity 0.22s ease, filter 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    }

    /* =========================================================
       1. THANH TRÊN CÙNG (TÊN APP, CHỌN GIAO DIỆN, HÌNH NỀN, NÚT 3 CHẤM)
       ========================================================= */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ef4444 0%, #f59e0b 35%, #10b981 70%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 0.94rem;
      line-height: 1.15;
      text-shadow: var(--shadow-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .glass-select {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 24px 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .glass-select option {
      background: #1e293b;
      color: #ffffff;
    }

    .glass-input {
      width: 100%;
      border: 1px solid var(--btn-border);
      background: var(--subpanel-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      padding: 9px 11px;
      border-radius: 8px;
      outline: none;
    }

    .glass-input:focus {
      border-color: #38bdf8;
    }

    .glass-btn {
      appearance: none;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-shadow: var(--shadow-text);
      transition: background 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
      white-space: nowrap;
    }

    .glass-btn:hover:not(:disabled) {
      background: var(--btn-bg-hover);
      transform: translateY(-1px);
    }

    .glass-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .glass-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .glass-btn.danger:not(:disabled) {
      background: rgba(255, 77, 109, 0.2);
      border-color: rgba(255, 77, 109, 0.48);
    }

    .glass-btn.danger:hover:not(:disabled) {
      background: rgba(255, 77, 109, 0.34);
      border-color: rgba(255, 77, 109, 0.7);
    }

    .glass-btn.primary {
      background: rgba(46, 229, 157, 0.2);
      border-color: rgba(46, 229, 157, 0.5);
    }

    .glass-btn.primary:hover:not(:disabled) {
      background: rgba(46, 229, 157, 0.32);
    }

    .dots-btn {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;
      padding: 5px 11px;
      letter-spacing: 1px;
    }

    /* =========================================================
       2. BẢNG SCRAMBLE (TRÊN)
       ========================================================= */
    .scramble-panel {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .scramble-text {
      font-family: var(--font-mono);
      font-size: clamp(1rem, 2.5vw, 1.32rem);
      font-weight: 700;
      line-height: 1.42;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      text-shadow: var(--shadow-text);
      text-align: center;
      word-spacing: 0.18em;
    }

    .scramble-subbar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* =========================================================
       3. BẢNG ĐỒNG HỒ BẤM GIỜ (GIỮA)
       ========================================================= */
    .timer-panel {
      flex: 1;
      min-height: 175px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      touch-action: none;
    }

    .timer-status-pill {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 8px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-secondary);
      text-shadow: var(--shadow-text);
      margin-bottom: 10px;
      transition: all 0.18s ease;
    }

    .timer-display {
      font-family: var(--font-mono);
      font-size: clamp(3.6rem, 12vw, 6.4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--state-idle);
      text-shadow: var(--shadow-text);
      transition: color 0.12s ease, transform 0.12s ease, text-shadow 0.12s ease;
    }

    .timer-display.is-holding {
      color: var(--state-holding);
      transform: scale(0.97);
      text-shadow: 0 0 24px rgba(255, 77, 109, 0.55);
    }

    .timer-display.is-ready {
      color: var(--state-ready);
      transform: scale(1.03);
      text-shadow: 0 0 26px rgba(46, 229, 157, 0.55);
    }

    .timer-display.is-running {
      color: var(--state-running);
    }

    .timer-hint {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      text-shadow: var(--shadow-text);
      max-width: 400px;
      line-height: 1.4;
    }

    .quick-penalty-bar {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 28px;
    }

    /* =========================================================
       4. KHỐI KỶ LỤC & THANH ĐIỀU HƯỚNG DƯỚI CÙNG (GIỐNG HÌNH MẪU)
       ========================================================= */
    .bottom-dock {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Hàng hiển thị kỷ lục AO5,PB, AO12, N + hình trải 2D Rubik bên phải */
    .records-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
    }

    .records-metrics {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(95px, 1fr));
      row-gap: 10px;
      column-gap: 16px;
    }

    .record-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .record-tag {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      min-width: 38px;
    }

    .record-val {
      font-family: var(--font-mono);
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-primary);
      text-shadow: var(--shadow-text);
    }

    .record-val.highlight {
      color: var(--accent-stat);
    }

    /* Hình trải 2D của khối Rubik 3x3 (Cube Net Preview) */
    .cube-net-box {
      background: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cube-net-grid {
      display: grid;
      grid-template-columns: repeat(4, 24px);
      grid-template-rows: repeat(3, 24px);
      gap: 3px;
    }

    .cube-face {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 1px;
      background: rgba(0, 0, 0, 0.55);
      padding: 1px;
      border-radius: 2px;
    }

    .sticker {
      width: 100%;
      height: 100%;
      border-radius: 1px;
    }

    /* Thanh tab 5 nút dưới cùng (Trang chủ, Lịch sử, Danh sách, Giao diện, Thêm •••) */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--subpanel-border);
      background: rgba(0, 0, 0, 0.18);
    }

    .nav-tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      position: relative;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-tab:hover {
      background: var(--btn-bg);
      color: var(--text-primary);
    }

    .nav-tab.is-active {
      color: var(--accent-stat);
    }

    .nav-icon {
      font-size: 1rem;
      line-height: 1;
      font-weight: 700;
    }

    .nav-label {
      font-size: 0.68rem;
      font-weight: 600;
    }

    .nav-badge {
      position: absolute;
      top: 3px;
      right: calc(50% - 22px);
      background: #2563eb;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      line-height: 1.2;
    }

    /* =========================================================
       DRAWER / POPUP CHO LỊCH SỬ & NÚT 3 CHẤM (DANH SÁCH GIẢI)
       ========================================================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 18, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .sheet-backdrop.is-open {
      display: flex;
    }

    .sheet-card {
      width: 100%;
      max-width: 480px;
      max-height: 86dvh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--subpanel-border);
      padding-bottom: 10px;
    }

    .sheet-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .session-manager {
      background: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      border-radius: calc(var(--panel-radius) - 4px);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .session-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .session-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .session-select {
      width: 100%;
    }

    .session-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .session-actions .glass-btn {
      flex: 1;
      padding: 7px 8px;
      font-size: 0.76rem;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .history-title {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .history-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .selection-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: calc(var(--panel-radius) - 6px);
      background: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      font-size: 0.78rem;
    }

    .select-all-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .solve-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #ff4d6d;
      cursor: pointer;
      flex-shrink: 0;
    }

    .history-list {
      flex: 1;
      min-height: 180px;
      max-height: 44dvh;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .history-list::-webkit-scrollbar {
      width: 5px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: var(--btn-border);
      border-radius: 6px;
    }

    .history-empty {
      margin: auto;
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-muted);
      padding: 24px 10px;
      line-height: 1.5;
    }

    .solve-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      border-radius: calc(var(--panel-radius) - 6px);
      background: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);

  <!-- =========================================================
       PHẦN 3: VANILLA JAVASCRIPT — WCA TIMER, 2D CUBE NET & MENU 3 CHẤM

  <script>
    (() => {
      'use strict';

      // ----- HẰNG SỐ LƯU TRỮ & TRẠNG THÁI -----
      const STORAGE_SESSIONS_KEY = 'wca_rubik_sessions_v2';
      const STORAGE_ACTIVE_SESSION_KEY = 'wca_rubik_active_session_v2';
      const LEGACY_SOLVES_KEY = 'wca_rubik_solves_v1';
      const STORAGE_BG_KEY = 'wca_rubik_bg_v1';
      const STORAGE_THEME_KEY = 'wca_rubik_theme_v1';
      const HOLD_DURATION_MS = 500;

      const TIMER_STATE = {
        IDLE: 'IDLE',
        HOLDING: 'HOLDING',
        READY: 'READY',
        RUNNING: 'RUNNING'
      };

      // ----- DOM ELEMENTS -----
      const themeSelectEl = document.getElementById('themeSelect');
      const activeSessionLabelEl = document.getElementById('activeSessionLabel');
      const scrambleDisplayEl = document.getElementById('scrambleDisplay');
      const newScrambleBtn = document.getElementById('newScrambleBtn');
      const changeBgBtn = document.getElementById('changeBgBtn');
      const resetBgBtn = document.getElementById('resetBgBtn');
      const bgFileInput = document.getElementById('bgFileInput');
      const openMenuDotsBtn = document.getElementById('openMenuDotsBtn');

      const timerZoneEl = document.getElementById('timerZone');
      const timerStatusEl = document.getElementById('timerStatus');
      const timerDisplayEl = document.getElementById('timerDisplay');
      const quickPenaltyBarEl = document.getElementById('quickPenaltyBar');

      const statAo5El = document.getElementById('statAo5');
      const statAo12El = document.getElementById('statAo12');
      const statBestEl = document.getElementById('statBest');
      const statCountEl = document.getElementById('statCount');
      const cubeNetGridEl = document.getElementById('cubeNetGrid');

      const navHomeBtn = document.getElementById('navHomeBtn');
      const navHistoryBtn = document.getElementById('navHistoryBtn');
      const navHistoryBadgeEl = document.getElementById('navHistoryBadge');
      const navManualBtn = document.getElementById('navManualBtn');
      const navBgBtn = document.getElementById('navBgBtn');
      const navMoreDotsBtn = document.getElementById('navMoreDotsBtn');

      const sheetBackdropEl = document.getElementById('sheetBackdrop');
      const closeSheetBtn = document.getElementById('closeSheetBtn');
      const sessionSelectEl = document.getElementById('sessionSelect');
      const newSessionBtn = document.getElementById('newSessionBtn');
      const renameSessionBtn = document.getElementById('renameSessionBtn');
      const deleteSessionBtn = document.getElementById('deleteSessionBtn');

      const historyListEl = document.getElementById('historyList');
      const addManualSolveBtn = document.getElementById('addManualSolveBtn');
      const exportListBtn = document.getElementById('exportListBtn');
      const selectAllSolvesEl = document.getElementById('selectAllSolves');
      const selectedCountTextEl = document.getElementById('selectedCountText');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');

      const modalBackdropEl = document.getElementById('modalBackdrop');
      const modalTitleEl = document.getElementById('modalTitle');
      const modalBodyEl = document.getElementById('modalBody');
      const modalActionsEl = document.getElementById('modalActions');
      const toastEl = document.getElementById('toast');

      // ----- BIẾN TRẠNG THÁI ỨNG DỤNG -----
      let state = TIMER_STATE.IDLE;
      let holdTimeoutId = null;
      let rafId = null;
      let startTimeMs = 0;
      let justStopped = false;
      let activePointerId = null;
      let currentScramble = '';
      let sessions = [];
      let activeSessionId = '';
      const selectedSolveIds = new Set();
      let toastTimeoutId = null;

      // ----- TIỆN ÍCH LOCALSTORAGE, COPY & TOAST -----
      function safeGetStorage(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (err) {
          return null;
        }
      }

      function safeSetStorage(key, value) {
        try {
          window.localStorage.setItem(key, value);
          return { ok: true };
        } catch (err) {
          return { ok: false, error: err };
        }
      }

      function safeRemoveStorage(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (err) {}
      }

      function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast('Đã sao chép danh sách vào bộ nhớ tạm!'),
            () => fallbackCopy(text)
          );
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Đã sao chép danh sách vào bộ nhớ tạm!');
        } catch (_) {
          showToast('Không thể tự sao chép, bạn hãy bôi đen và copy thủ công nhé.');
        }
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('is-visible');
        if (toastTimeoutId) clearTimeout(toastTimeoutId);
        toastTimeoutId = setTimeout(() => {
          toastEl.classList.remove('is-visible');
        }, 3000);
      }

      // ----- ĐÓNG / MỞ SHEET DANH SÁCH (NÚT 3 CHẤM) -----
      function openSheet() {
        sheetBackdropEl.classList.add('is-open');
      }

      function closeSheet() {
        sheetBackdropEl.classList.remove('is-open');
      }

      openMenuDotsBtn.addEventListener('click', openSheet);
      navMoreDotsBtn.addEventListener('click', openSheet);
      navHistoryBtn.addEventListener('click', openSheet);
      closeSheetBtn.addEventListener('click', closeSheet);

      navHomeBtn.addEventListener('click', () => {
        closeSheet();
        closeModal();
      });

      navManualBtn.addEventListener('click', () => {
        openAddManualSolveModal();
      });

      navBgBtn.addEventListener('click', () => {
        bgFileInput.click();
      });

      sheetBackdropEl.addEventListener('click', (e) => {
        if (e.target === sheetBackdropEl) closeSheet();
      });

      // ----- 0. QUẢN LÝ GIAO DIỆN CƠ BẢN -----
      function applyTheme(themeName) {
        const validThemes = ['classic', 'glass', 'dark', 'light'];
        const chosen = validThemes.includes(themeName) ? themeName : 'classic';
        document.body.setAttribute('data-theme', chosen);
        themeSelectEl.value = chosen;
        safeSetStorage(STORAGE_THEME_KEY, chosen);
      }

      themeSelectEl.addEventListener('change', (e) => {
        applyTheme(e.target.value);
        themeSelectEl.blur();
      });

      // ----- 1. MÔ PHỎNG HÌNH TRẢI 2D KHỐI RUBIK 3x3 THEO SCRAMBLE -----
      const FACE_COLORS = {
        U: '#ffffff', // Trắng
        L: '#f97316', // Cam
        F: '#22c55e', // Xanh lá
        R: '#ef4444', // Đỏ
        B: '#3b82f6', // Xanh dương
        D: '#eab308'  // Vàng
      };

      function createSolvedCube() {
        return {
          U: Array(9).fill('U'),
          L: Array(9).fill('L'),
          F: Array(9).fill('F'),
          R: Array(9).fill('R'),
          B: Array(9).fill('B'),
          D: Array(9).fill('D')
        };
      }

      function rotateFaceCW(arr) {
        return [
          arr[6], arr[3], arr[0],
          arr[7], arr[4], arr[1],
          arr[8], arr[5], arr[2]
        ];
      }

      function applyTurnCW(cube, moveFace) {
        cube[moveFace] = rotateFaceCW(cube[moveFace]);
        const { U, D, L, R, F, B } = cube;
        let temp;

        if (moveFace === 'U') {
          temp = [F[0], F[1], F[2]];
          [F[0], F[1], F[2]] = [R[0], R[1], R[2]];
          [R[0], R[1], R[2]] = [B[0], B[1], B[2]];
          [B[0], B[1], B[2]] = [L[0], L[1], L[2]];
          [L[0], L[1], L[2]] = temp;
        } else if (moveFace === 'D') {
          temp = [F[6], F[7], F[8]];
          [F[6], F[7], F[8]] = [L[6], L[7], L[8]];
          [L[6], L[7], L[8]] = [B[6], B[7], B[8]];
          [B[6], B[7], B[8]] = [R[6], R[7], R[8]];
          [R[6], R[7], R[8]] = temp;
        } else if (moveFace === 'R') {
          temp = [U[2], U[5], U[8]];
          [U[2], U[5], U[8]] = [F[2], F[5], F[8]];
          [F[2], F[5], F[8]] = [D[2], D[5], D[8]];
          [D[2], D[5], D[8]] = [B[6], B[3], B[0]];
          [B[6], B[3], B[0]] = temp;
        } else if (moveFace === 'L') {
          temp = [U[0], U[3], U[6]];
          [U[0], U[3], U[6]] = [B[8], B[5], B[2]];
          [B[8], B[5], B[2]] = [D[0], D[3], D[6]];
          [D[0], D[3], D[6]] = [F[0], F[3], F[6]];
          [F[0], F[3], F[6]] = temp;
        } else if (moveFace === 'F') {
          temp = [U[6], U[7], U[8]];
          [U[6], U[7], U[8]] = [L[8], L[5], L[2]];
          [L[8], L[5], L[2]] = [D[2], D[1], D[0]];
          [D[2], D[1], D[0]] = [R[0], R[3], R[6]];
          [R[0], R[3], R[6]] = temp;
        } else if (moveFace === 'B') {
          temp = [U[0], U[1], U[2]];
          [U[0], U[1], U[2]] = [R[2], R[5], R[8]];
          [R[2], R[5], R[8]] = [D[8], D[7], D[6]];
          [D[8], D[7], D[6]] = [L[6], L[3], L[0]];
          [L[6], L[3], L[0]] = temp;
        }
      }

      function renderCubeNet(scrambleStr) {
        const cube = createSolvedCube();
        const tokens = (scrambleStr || '').trim().split(/\s+/).filter(Boolean);

        tokens.forEach((tok) => {
          const face = tok[0];
          if (!['U', 'D', 'L', 'R', 'F', 'B'].includes(face)) return;
          const mod = tok.slice(1);
          const turns = mod === '2' ? 2 : mod === "'" ? 3 : 1;
          for (let i = 0; i < turns; i++) applyTurnCW(cube, face);
        });

        // Lưới 4x3 cho hình trải chữ thập:
        // [ ., U, ., . ]
        // [ L, F, R, B ]
        // [ ., D, ., . ]
        const layout = [
          null, 'U', null, null,
          'L',  'F', 'R',  'B',
          null, 'D', null, null
        ];

        cubeNetGridEl.innerHTML = '';
        layout.forEach((faceKey) => {

            cubeNetGridEl.appendChild(empty);
            return;

            sticker.style.backgroundColor = FACE_COLORS[colorCode] || '#ffffff';
            faceEl.appendChild(sticker);
          });
          cubeNetGridEl.appendChild(faceEl);
        });
      }

      function getActiveSession() {
        let found = sessions.find((s) => s.id === activeSessionId);
        if (!found && sessions.length > 0) {
          found = sessions[0];
          activeSessionId = found.id;
        }
        return found;
      }

      function getActiveSolves() {
        const current = getActiveSession();
        return current ? current.solves : [];
      }

      function saveSessions() {
        const res = safeSetStorage(STORAGE_SESSIONS_KEY, JSON.stringify(sessions));
        safeSetStorage(STORAGE_ACTIVE_SESSION_KEY, activeSessionId);
        if (!res.ok) {
          showToast('Bộ nhớ trình duyệt đã đầy, không thể lưu thêm dữ liệu.');
        }
      }

      function loadSessions() {
        const raw = safeGetStorage(STORAGE_SESSIONS_KEY);
        const savedActive = safeGetStorage(STORAGE_ACTIVE_SESSION_KEY);

        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              sessions = parsed;
              activeSessionId = savedActive && sessions.some((s) => s.id === savedActive)
                ? savedActive
                : sessions[0].id;
              return;
            }
          } catch (_) {}
        }

        let initialSolves = [];
        const legacyRaw = safeGetStorage(LEGACY_SOLVES_KEY);
        if (legacyRaw) {
          try {
            const parsedLegacy = JSON.parse(legacyRaw);
            if (Array.isArray(parsedLegacy)) initialSolves = parsedLegacy;
          } catch (_) {}
        }

        const defaultSession = {
          id: 'session-' + Date.now(),
          name: 'Danh sách 1 (3x3)',
          solves: initialSolves
        };
        sessions = [defaultSession];
        activeSessionId = defaultSession.id;
        saveSessions();
      }

      // ----- 3. ĐỊNH DẠNG THỜI GIAN & TÍNH TOÁN WCA -----
      function formatTime(ms) {
        if (ms === Infinity) return 'DNF';
        const totalCentiseconds = Math.floor(ms / 10);
        const cs = totalCentiseconds % 100;
        const totalSeconds = Math.floor(totalCentiseconds / 100);
        const seconds = totalSeconds % 60;
        const minutes = Math.floor(totalSeconds / 60);

        const csStr = String(cs).padStart(2, '0');
        if (minutes > 0) {
          return `${minutes}:${String(seconds).padStart(2, '0')}.${csStr}`;
        }
        return `${seconds}.${csStr}`;
      }

      function getEffectiveTime(solve) {
        if (solve.penalty === 'DNF') return Infinity;
        if (solve.penalty === '+2') return solve.timeMs + 2000;
        return solve.timeMs;
      }

      function formatSolveDisplay(solve) {
        if (solve.penalty === 'DNF') return 'DNF';
        if (solve.penalty === '+2') return `${formatTime(solve.timeMs + 2000)}+`;
        return formatTime(solve.timeMs);
      }

      function calculateWCAAverage(solveList, windowSize) {
        if (solveList.length < windowSize) return null;
        const recent = solveList.slice(0, windowSize).map(getEffectiveTime);
        const sorted = [...recent].sort((a, b) => a - b);

        const trimmed = sorted.slice(1, windowSize - 1);
        if (trimmed.some((t) => t === Infinity)) {
          return Infinity;
        }
        const sum = trimmed.reduce((acc, val) => acc + val, 0);
        return sum / trimmed.length;
      }

      // ----- 4. BỘ SINH SCRAMBLE 3x3 CHUẨN WCA (20-22 MOVES) -----
      function generateScramble() {
        const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
        const axisMap = { U: 0, D: 0, L: 1, R: 1, F: 2, B: 2 };
        const modifiers = ['', "'", '2'];
        const length = 20 + Math.floor(Math.random() * 3);

        const moves = [];
        let prevFace = null;
        let prevAxis = null;
        let prev2Axis = null;

        for (let i = 0; i < length; i++) {
          const candidates = faces.filter((face) => {
            if (face === prevFace) return false;
            if (prevAxis !== null && prev2Axis !== null && prevAxis === prev2Axis && axisMap[face] === prevAxis) {
              return false;
            }
            return true;
          });

          const chosenFace = candidates[Math.floor(Math.random() * candidates.length)];
          const chosenMod = modifiers[Math.floor(Math.random() * modifiers.length)];

          moves.push(chosenFace + chosenMod);

          prev2Axis = prevAxis;
          prevAxis = axisMap[chosenFace];
          prevFace = chosenFace;
        }

        currentScramble = moves.join(' ');
        scrambleDisplayEl.textContent = currentScramble;
        renderCubeNet(currentScramble);
      }

      // ----- 5. CƠ CHẾ ĐỒNG HỒ CHUẨN WCA -----
      function setTimerVisual(newState) {
        timerDisplayEl.classList.remove('is-holding', 'is-ready', 'is-running');
        document.body.classList.remove('is-timing');

        if (newState === TIMER_STATE.HOLDING) {
          timerDisplayEl.classList.add('is-holding');
          timerStatusEl.textContent = 'Đang giữ...';
          document.body.classList.add('is-timing');
        } else if (newState === TIMER_STATE.READY) {
          timerDisplayEl.classList.add('is-ready');
          timerStatusEl.textContent = 'Sẵn sàng! (Thả ra)';
          document.body.classList.add('is-timing');
        } else if (newState === TIMER_STATE.RUNNING) {
          timerDisplayEl.classList.add('is-running');
          timerStatusEl.textContent = 'Đang giải...';
          document.body.classList.add('is-timing');
        } else {
          timerStatusEl.textContent = 'Sẵn sàng';
        }
      }

      function startHold() {
        if (
          state !== TIMER_STATE.IDLE ||
          modalBackdropEl.classList.contains('is-open') ||
          sheetBackdropEl.classList.contains('is-open')
        ) {
          return;
        }
        state = TIMER_STATE.HOLDING;
        setTimerVisual(state);

        holdTimeoutId = setTimeout(() => {
          if (state === TIMER_STATE.HOLDING) {
            state = TIMER_STATE.READY;
            setTimerVisual(state);
            if (navigator.vibrate) {
              try { navigator.vibrate(18); } catch (_) {}
            }
          }
        }, HOLD_DURATION_MS);
      }

      function cancelOrStartOnRelease() {
        if (state === TIMER_STATE.HOLDING) {
          clearTimeout(holdTimeoutId);
          holdTimeoutId = null;
          state = TIMER_STATE.IDLE;
          setTimerVisual(state);
        } else if (state === TIMER_STATE.READY) {
          clearTimeout(holdTimeoutId);
          holdTimeoutId = null;
          startTimer();
        }
      }

      function updateTimerFrame() {
        if (state !== TIMER_STATE.RUNNING) return;
        const elapsed = Date.now() - startTimeMs;
        timerDisplayEl.textContent = formatTime(elapsed);
        rafId = requestAnimationFrame(updateTimerFrame);
      }

      function startTimer() {
        state = TIMER_STATE.RUNNING;
        startTimeMs = Date.now();
        setTimerVisual(state);
        quickPenaltyBarEl.innerHTML = '';
        rafId = requestAnimationFrame(updateTimerFrame);
      }

      function stopTimer() {
        if (state !== TIMER_STATE.RUNNING) return;
        const finalMs = Date.now() - startTimeMs;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }

        state = TIMER_STATE.IDLE;
        justStopped = true;
        setTimerVisual(state);
        timerDisplayEl.textContent = formatTime(finalMs);

        const newSolve = {
          id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
          timeMs: finalMs,
          penalty: null,
          scramble: currentScramble,
          createdAt: new Date().toISOString()
        };

        const current = getActiveSession();
        if (current) {
          current.solves.unshift(newSolve);
          saveSessions();
        }
        renderAllStatsAndHistory();
        generateScramble();
      }

      document.addEventListener('keydown', (e) => {
        if (modalBackdropEl.classList.contains('is-open')) {
          if (e.key === 'Escape') closeModal();
          return;
        }
        if (sheetBackdropEl.classList.contains('is-open')) {
          if (e.key === 'Escape') closeSheet();
          return;
        }

        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

        if (state === TIMER_STATE.RUNNING) {
          e.preventDefault();
          stopTimer();
          return;
        }

        if (e.code === 'Space') {
          if (document.activeElement && (activeTag === 'BUTTON' || activeTag === 'SELECT')) {
            document.activeElement.blur();
          }
          e.preventDefault();
          if (e.repeat || justStopped) return;
          startHold();
        }
      });

      document.addEventListener('keyup', (e) => {
        if (modalBackdropEl.classList.contains('is-open') || sheetBackdropEl.classList.contains('is-open')) return;
        if (e.code === 'Space') {
          e.preventDefault();
          if (justStopped) {
            justStopped = false;
            return;
          }
          cancelOrStartOnRelease();
        } else {
          justStopped = false;
        }
      });

      document.addEventListener('pointerdown', (e) => {
        if (state === TIMER_STATE.RUNNING) {
          e.preventDefault();
          stopTimer();
        }
      }, { capture: true });

      timerZoneEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button, a, input, label, select')) return;
        if (state === TIMER_STATE.RUNNING || justStopped) return;
        if (e.button !== 0 && e.pointerType === 'mouse') return;

        activePointerId = e.pointerId;
        startHold();
      });

      window.addEventListener('pointerup', (e) => {
        if (justStopped) {
          justStopped = false;
          activePointerId = null;
          return;
        }
        if (activePointerId !== null && e.pointerId === activePointerId) {
          activePointerId = null;
          cancelOrStartOnRelease();
        }
      });

      window.addEventListener('pointercancel', (e) => {
        if (activePointerId !== null && e.pointerId === activePointerId) {
          activePointerId = null;
          if (state === TIMER_STATE.HOLDING || state === TIMER_STATE.READY) {
            clearTimeout(holdTimeoutId);
            state = TIMER_STATE.IDLE;
            setTimerVisual(state);
          }
        }
      });

      // ----- 6. CHỌN & XÓA KỶ LỤC (PHẢI TÍCH CHỌN MỚI XÓA ĐƯỢC) -----
      function toggleSelectSolve(solveId) {
        if (selectedSolveIds.has(solveId)) {
          selectedSolveIds.delete(solveId);
        } else {
          selectedSolveIds.add(solveId);
        }
        renderAllStatsAndHistory();
      }

      selectAllSolvesEl.addEventListener('change', (e) => {
        const solves = getActiveSolves();
        if (e.target.checked) {
          solves.forEach((s) => selectedSolveIds.add(s.id));
        } else {
          selectedSolveIds.clear();
        }
        renderAllStatsAndHistory();
      });

      function updateSelectionBarUI() {
        const solves = getActiveSolves();
        const validIds = new Set(solves.map((s) => s.id));
        for (const id of [...selectedSolveIds]) {
          if (!validIds.has(id)) selectedSolveIds.delete(id);
        }

        const count = selectedSolveIds.size;
        selectAllSolvesEl.disabled = solves.length === 0;
        selectAllSolvesEl.checked = solves.length > 0 && count === solves.length;
        selectAllSolvesEl.indeterminate = count > 0 && count < solves.length;

        if (count === 0) {
          selectedCountTextEl.textContent = 'Chọn kỷ lục để xóa';
          clearHistoryBtn.disabled = true;
          clearHistoryBtn.textContent = 'Xóa đã chọn (0)';
        } else {
          selectedCountTextEl.textContent = `Đã chọn ${count}/${solves.length}`;
          clearHistoryBtn.disabled = false;
          clearHistoryBtn.textContent = `Xóa đã chọn (${count})`;
        }
      }

      function togglePenalty(solveId, type) {
        const solves = getActiveSolves();
        const target = solves.find((s) => s.id === solveId);
        if (!target) return;
        target.penalty = target.penalty === type ? null : type;
        saveSessions();
        renderAllStatsAndHistory();
        if (solves[0] && solves[0].id === solveId) {
          timerDisplayEl.textContent = formatSolveDisplay(solves[0]);
        }
      }

      function renderQuickPenaltyBar() {
        quickPenaltyBarEl.innerHTML = '';
        const solves = getActiveSolves();
        if (solves.length === 0) return;

        const latest = solves[0];
        const btnPlus2 = document.createElement('button');
        btnPlus2.type = 'button';
        btnPlus2.className = `mini-btn ${latest.penalty === '+2' ? 'active-penalty' : ''}`;
        btnPlus2.textContent = '+2';
        btnPlus2.addEventListener('click', () => togglePenalty(latest.id, '+2'));

        const btnDnf = document.createElement('button');
        btnDnf.type = 'button';
        btnDnf.className = `mini-btn ${latest.penalty === 'DNF' ? 'active-dnf' : ''}`;
        btnDnf.textContent = 'DNF';
        btnDnf.addEventListener('click', () => togglePenalty(latest.id, 'DNF'));

        const btnOpenList = document.createElement('button');
        btnOpenList.type = 'button';
        btnOpenList.className = 'mini-btn';
        btnOpenList.textContent = 'Chọn xóa trong DS •••';
        btnOpenList.addEventListener('click', () => {
          selectedSolveIds.add(latest.id);
          renderAllStatsAndHistory();
          openSheet();
        });

        quickPenaltyBarEl.append(btnPlus2, btnDnf, btnOpenList);
      }

      function renderAllStatsAndHistory() {
        renderSessionSelect();
        const solves = getActiveSolves();

        statCountEl.textContent = String(solves.length);
        navHistoryBadgeEl.textContent = String(solves.length);

        const ao5 = calculateWCAAverage(solves, 5);
        statAo5El.textContent = ao5 === null ? '-' : formatTime(ao5);

        const ao12 = calculateWCAAverage(solves, 12);
        statAo12El.textContent = ao12 === null ? '-' : formatTime(ao12);

        const validTimes = solves.map(getEffectiveTime).filter((t) => t !== Infinity);
        statBestEl.textContent = validTimes.length > 0 ? formatTime(Math.min(...validTimes)) : '-';

        updateSelectionBarUI();
        renderQuickPenaltyBar();

        historyListEl.innerHTML = '';
        if (solves.length === 0) {
          const emptyEl = document.createElement('div');
          emptyEl.className = 'history-empty';
          emptyEl.textContent = 'Danh sách này chưa có lần giải nào. Nhấn giữ Space hoặc bấm "+ Nhập giờ" để thêm!';
          historyListEl.appendChild(emptyEl);
          return;
        }

        const total = solves.length;
        solves.forEach((solve, idx) => {
          const isChecked = selectedSolveIds.has(solve.id);
          const row = document.createElement('div');
          row.className = `solve-item ${isChecked ? 'is-selected' : ''}`;

          const leftGroup = document.createElement('div');
          leftGroup.className = 'solve-left';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'solve-checkbox';
          checkbox.checked = isChecked;
          checkbox.title = 'Tích chọn kỷ lục này để xóa';
          checkbox.setAttribute('aria-label', `Chọn lần giải #${total - idx}`);
          checkbox.addEventListener('change', () => toggleSelectSolve(solve.id));

          const main = document.createElement('div');
          main.className = 'solve-main';
          main.title = 'Nhấn để xem chi tiết scramble';
          main.addEventListener('click', () => openSolveDetailModal(solve, total - idx));

          const numSpan = document.createElement('span');
          numSpan.className = 'solve-index';
          numSpan.textContent = `#${total - idx}`;

          const timeSpan = document.createElement('span');
          timeSpan.className = 'solve-time';
          timeSpan.textContent = formatSolveDisplay(solve);

          main.append(numSpan, timeSpan);
          leftGroup.append(checkbox, main);

          const actions = document.createElement('div');
          actions.className = 'solve-actions';

          const p2Btn = document.createElement('button');
          p2Btn.type = 'button';
          p2Btn.className = `mini-btn ${solve.penalty === '+2' ? 'active-penalty' : ''}`;
          p2Btn.textContent = '+2';
          p2Btn.addEventListener('click', () => togglePenalty(solve.id, '+2'));

          const dnfBtn = document.createElement('button');
          dnfBtn.type = 'button';
          dnfBtn.className = `mini-btn ${solve.penalty === 'DNF' ? 'active-dnf' : ''}`;
          dnfBtn.textContent = 'DNF';
          dnfBtn.addEventListener('click', () => togglePenalty(solve.id, 'DNF'));

          actions.append(p2Btn, dnfBtn);
          row.append(leftGroup, actions);
          historyListEl.appendChild(row);
        });
      }

      function closeModal() {
        modalBackdropEl.classList.remove('is-open');
      }

      function openSolveDetailModal(solve, orderNum) {
        modalTitleEl.textContent = `Lần giải #${orderNum} — ${formatSolveDisplay(solve)}`;
        modalBodyEl.innerHTML = '';

        const timeP = document.createElement('p');
        const dateLabel = solve.createdAt
          ? new Date(solve.createdAt).toLocaleString('vi-VN')
          : 'Không rõ thời gian';
        timeP.textContent = `Thời điểm: ${dateLabel}`;

        const scrambleBox = document.createElement('div');
        scrambleBox.className = 'modal-scramble';
        scrambleBox.textContent = solve.scramble || 'Không có scramble';

        modalBodyEl.append(timeP, scrambleBox);
        modalActionsEl.innerHTML = '';

        const selectToggleBtn = document.createElement('button');
        selectToggleBtn.type = 'button';
        const isSelected = selectedSolveIds.has(solve.id);
        selectToggleBtn.className = `glass-btn ${isSelected ? '' : 'danger'}`;
        selectToggleBtn.textContent = isSelected ? 'Bỏ chọn xóa' : 'Chọn để xóa';
        selectToggleBtn.addEventListener('click', () => {
          toggleSelectSolve(solve.id);
          closeModal();
        });

        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'glass-btn';
        closeBtn.textContent = 'Đóng';
        closeBtn.addEventListener('click', closeModal);

        modalActionsEl.append(selectToggleBtn, closeBtn);
        modalBackdropEl.classList.add('is-open');
      }

      function openDeleteSelectedConfirmModal() {
        const current = getActiveSession();
        if (!current || selectedSolveIds.size === 0) {
          showToast('Vui lòng tích chọn ít nhất 1 kỷ lục trước khi xóa.');
          return;
        }

        const count = selectedSolveIds.size;
        modalTitleEl.textContent = `Xóa ${count} kỷ lục đã chọn?`;
        modalBodyEl.textContent = `Bạn có chắc muốn xóa ${count} kỷ lục đã tích chọn khỏi "${current.name}"? Các kỷ lục không được chọn sẽ giữ nguyên.`;
        modalActionsEl.innerHTML = '';

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'glass-btn';
        cancelBtn.textContent = 'Hủy';
        cancelBtn.addEventListener('click', closeModal);

        const confirmBtn = document.createElement('button');
        confirmBtn.type = 'button';
        confirmBtn.className = 'glass-btn danger';
        confirmBtn.textContent = `Xóa ${count} kỷ lục`;
        confirmBtn.addEventListener('click', () => {
          current.solves = current.solves.filter((s) => !selectedSolveIds.has(s.id));
          selectedSolveIds.clear();
          saveSessions();
          renderAllStatsAndHistory();
          timerDisplayEl.textContent = current.solves.length > 0
            ? formatSolveDisplay(current.solves[0])
            : '0.00';
          closeModal();
          showToast(`Đã xóa ${count} kỷ lục đã chọn.`);
        });

        modalActionsEl.append(cancelBtn, confirmBtn);
        modalBackdropEl.classList.add('is-open');
      }

      modalBackdropEl.addEventListener('click', (e) => {
        if (e.target === modalBackdropEl) closeModal();
      });

      // ----- 7. ĐỔI HÌNH NỀN & NÉN ẢNH BẰNG CANVAS API -----
      function applyBackground(dataUrl) {
        if (dataUrl) {
          document.body.style.backgroundImage = `url("${dataUrl}")`;
          resetBgBtn.style.display = 'inline-flex';
        } else {
          document.body.style.backgroundImage = '';
          resetBgBtn.style.display = 'none';
        }
      }

      function compressImageWithCanvas(img, maxDim, quality) {
        const canvas = document.createElement('canvas');
        let { width, height } = img;

        if (width > maxDim || height > maxDim) {
          if (width >= height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        return canvas.toDataURL('image/jpeg', quality);
      }

      function handleBackgroundUpload(file) {
        if (!file || !file.type.startsWith('image/')) {
          showToast('Vui lòng chọn tệp hình ảnh hợp lệ.');
          return;
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const profiles = [
              { maxDim: 1600, quality: 0.82 },
              { maxDim: 1400, quality: 0.72 },
              { maxDim: 1200, quality: 0.62 },
              { maxDim: 960, quality: 0.52 }
            ];

            let saved = false;
            for (const profile of profiles) {
              const dataUrl = compressImageWithCanvas(img, profile.maxDim, profile.quality);
              if (dataUrl.length > 2200000 && profile !== profiles[profiles.length - 1]) {
                continue;
              }
              const result = safeSetStorage(STORAGE_BG_KEY, dataUrl);
              if (result.ok) {
                applyBackground(dataUrl);
                showToast('Đã cập nhật và lưu hình nền!');
                saved = true;
                break;
              }
            }

            if (!saved) {
              showToast('Ảnh quá lớn vượt giới hạn bộ nhớ trình duyệt. Hãy thử ảnh khác nhẹ hơn.');
            }
          };
          img.onerror = () => showToast('Không thể đọc tệp ảnh này.');
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      changeBgBtn.addEventListener('click', () => bgFileInput.click());

      bgFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) handleBackgroundUpload(file);
        bgFileInput.value = '';
      });

      resetBgBtn.addEventListener('click', () => {
        safeRemoveStorage(STORAGE_BG_KEY);
        applyBackground(null);
        showToast('Đã khôi phục hình nền mặc định.');
      });

      newScrambleBtn.addEventListener('click', () => {
        generateScramble();
        newScrambleBtn.blur();
      });

      clearHistoryBtn.addEventListener('click', openDeleteSelectedConfirmModal);

      // ----- KHỞI TẠO ỨNG DỤNG -----
      function init() {
        const savedTheme = safeGetStorage(STORAGE_THEME_KEY);
        applyTheme(savedTheme || 'classic');

        const savedBg = safeGetStorage(STORAGE_BG_KEY);
        if (savedBg) applyBackground(savedBg);

        loadSessions();
        renderAllStatsAndHistory();
        generateScramble();
      }

      init();
    })();
  </script>
</body>
